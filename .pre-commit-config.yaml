# See https://pre-commit.com for usage:
#   pip install pre-commit   (or: brew install pre-commit)
#   pre-commit install
repos:
  - repo: local
    hooks:
      - id: ui-lint
        name: ui-lint
        entry: npm run lint
        language: system
        files: \.(js|jsx|ts|tsx)$
      - id: ui-format
        name: ui-format
        entry: npm run format
        language: system
        files: \.(js|jsx|ts|tsx|json|css|scss|html|md|ya?ml)$
