name: Copy Release Assets

# Copies every asset from one release to another inside CI, so public
# release artifacts never pass through a laptop. Each asset is checked
# against the SHA-256 digest GitHub recorded at upload before it is
# re-uploaded. Uploads fail rather than overwrite if a name already exists
# on the target release. See #622.

on:
  workflow_dispatch:
    inputs:
      source_release_id:
        description: "Numeric ID of the release to copy assets from (e.g. a stray draft)"
        required: true
        type: string
      target_tag:
        description: "Tag of the release to copy assets to (e.g. v0.34.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  copy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Copy assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ID: ${{ inputs.source_release_id }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_ID" =~ ^[0-9]+$ ]] || { echo "source_release_id must be numeric"; exit 1; }

          target_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}" --jq .id)"
          if [ "$target_id" = "$SOURCE_ID" ]; then
            echo "Source and target are the same release"; exit 1
          fi

          mkdir -p "$RUNNER_TEMP/assets" && cd "$RUNNER_TEMP/assets"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${SOURCE_ID}/assets" \
            --jq '.[] | "\(.id)\t\(.name)\t\(.digest)"' > assets.tsv
          [ -s assets.tsv ] || { echo "Source release has no assets"; exit 1; }

          names=()
          while IFS=$'\t' read -r id name digest; do
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > "$name"
            echo "${digest#sha256:}  ${name}" | sha256sum -c -
            names+=("$name")
          done < assets.tsv

          gh release upload "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" "${names[@]}"
          echo "Copied ${#names[@]} assets from release ${SOURCE_ID} to ${TARGET_TAG}"
