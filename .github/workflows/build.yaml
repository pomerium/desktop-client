name: Build

on:
  push:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:wine
      env:
        ELECTRON_CACHE: "/root/.cache/electron"
        ELECTRON_BUILDER_CACHE: "/root/.cache/electron-builder"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .tool-versions

      - name: Install dependencies
        run: |
          npm ci

      - name: build
        run: |
          git config --global --add safe.directory /__w/desktop-client/desktop-client
          # mac requires dmg-builder, which doesn't get installed for some reason
          #npm run package -m --arm64
          npm run package -l --arm64
          npm run package -l --x64
          # windows complains about home directory permissions.
          #npm run package -w --x64
