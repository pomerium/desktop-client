name: Publish

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
      issues: read
      pull-requests: read
    runs-on: ${{ matrix.os }}

    # Serialize publish runs so overlapping pushes can't each find no
    # release and create separate drafts for the same version (#622).
    concurrency:
      group: publish
      cancel-in-progress: false

    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Install dependencies
        run: |
          npm ci

      - name: Import Apple CSC
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPLE_APP_CSC }}
          p12-password: ${{ secrets.APPLE_APP_CSC_PASSWORD }}

      - name: Set up Apple ID Credentials
        run: |
          mkdir ~/private_keys
          key_path=~/private_keys/AuthKey_${{ secrets.APPLE_ID }}.p8
          echo "${{ secrets.APPLE_ID_KEY }}" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # electron-builder creates the release on first upload if it doesn't
      # exist, but parallel uploads race and can create duplicate drafts
      # that split the assets (#622). Create it up front so every upload
      # finds the same release. Skip if any release (draft or published)
      # already uses the tag, so pushes after a release don't add drafts.
      #
      # Release notes are generated by GitHub (categories come from
      # .github/release.yml) and regenerated on every push while the
      # release is still a draft, so PRs merged after the version bump are
      # included. Manual edits to a draft's notes are overwritten by the
      # next push; edit them right before publishing.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.github_token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"${tag}\") | {id, draft}")"
          if [ -z "$releases" ]; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "$version" --generate-notes
          elif echo "$releases" | jq -e 'select(.draft == false)' > /dev/null; then
            echo "Release for ${tag} is already published, skipping"
          else
            notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" --jq .body)"
            for id in $(echo "$releases" | jq -r .id); do
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" \
                -f body="$notes" -f target_commitish="$GITHUB_SHA" > /dev/null
              echo "Updated notes on draft release ${id} for ${tag}"
            done
          fi

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_KEY_ISSUER: ${{ secrets.APPLE_ID_KEY_ISSUER }}
        run: |
          npm run release -- -m --arm64
          npm run release -- -l --arm64
          npm run release -- -l --x64
          npm run release -- -w --x64
