version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 50
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 50
    ignore:
      # eslint >=9 requires flat config, which eslint-config-airbnb does not
      # support. Pin to v8 until the lint config is migrated off airbnb.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-compat'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns:
          - '*'
